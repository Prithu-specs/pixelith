name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test tooling
        run: pip install pytest ruff

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check pixelith

      # Model weights are tens of megabytes and are fetched from Hugging Face on
      # first use. CI must never download them, so tests that need real weights
      # are marked `needs_model` and deselected here.
      - name: Run tests
        env:
          PIXELITH_HOME: ${{ runner.temp }}/pixelith-home
          PIXELITH_OUT: ${{ runner.temp }}/pixelith-out
        run: pytest tests -v -m "not needs_model"
